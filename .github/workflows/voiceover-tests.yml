name: Voiceover Foundation Tests

on:
  push:
    branches:
      - feature/elevenlabs-voiceover-foundation
  pull_request:
    paths:
      - 'voiceover_*.py'
      - 'ui/voiceover.py'
      - 'app.py'
      - 'tests/test_voiceover_*.py'
      - '.github/workflows/voiceover-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run isolated, non-billable unit tests
        run: python -m unittest discover -s tests -p 'test_voiceover_*.py' -v

  gradio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production Gradio and HTTP dependency
        run: python -m pip install 'gradio==6.26.0' 'requests>=2.31,<3'
      - name: Build Script Studio with real Gradio components
        run: python -m unittest discover -s tests -p 'test_voiceover_gradio_smoke.py' -v
