name: Voiceover Foundation Tests

on:
  push:
    branches:
      - feature/elevenlabs-voiceover-foundation
  pull_request:
    paths:
      - 'voiceover_*.py'
      - 'ui/voiceover.py'
      - 'tests/test_voiceover_*.py'
      - '.github/workflows/voiceover-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated, non-billable unit tests
        run: python -m unittest discover -s tests -p 'test_voiceover_*.py' -v
